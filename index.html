// ---- 搜尋邏輯 ----
function searchSeries(query) {
  if (!query.trim()) return [];
  const q = query.toLowerCase().replace(/\s+/g, "");
  if (q === "全部系列" || q === "全部" || q === "所有系列") return SERIES;
  return SERIES.filter(s => {
    const searchable = [
      s.name, s.category, s.age, s.benefit,
      ...s.intro.map(i => i.title + i.body),
      ...s.keywords,
      ...s.books.map(b => b.title)
    ].join(" ").toLowerCase().replace(/\s+/g, "");
    return searchable.includes(q);
  });
}

// ---- 渲染系列卡片 ----
function renderCard(s) {
  const totalBooks = s.books.filter(b => b.count !== null).reduce((sum, b) => sum + (b.count || 0), 0);
  const bookCountLabel = s.books.length > 0
    ? `共 ${s.books.length} 個品項${totalBooks > 0 ? `，含 ${totalBooks} 冊` : ""}`
    : "";
  const introHtml = s.intro.map(i =>
    `<li><b>${i.title}：</b>${i.body}</li>`
  ).join("");
  const keywordHtml = s.keywords.map(k => `<span class="tag">${k}</span>`).join("");
  const bookHtml = s.books.map(b =>
    `<li>${b.title}${b.count ? `<span style="color:#888;font-size:0.8rem;">（${b.count}冊）</span>` : ""}</li>`
  ).join("");
  return `
  <div class="series-card">
    <h2>${s.name} <span style="font-size:0.8rem;color:#777;font-weight:400;">${s.category}</span></h2>
    <div class="info-block">
      <div class="info-label">📋 系列介紹</div>
      <div class="info-content bold-intro"><ul>${introHtml}</ul></div>
    </div>
    <div class="info-block">
      <div class="info-label">✅ 系列優點</div>
      <div class="info-content">${s.benefit}</div>
    </div>
    <div class="info-block">
      <div class="info-label">👶 適合 TA</div>
      <div class="info-content"><span class="age-tag">${s.age}</span></div>
    </div>
    <div class="info-block">
      <div class="info-label">🔖 系列關鍵字</div>
      <div class="info-content">${keywordHtml}</div>
    </div>
    <div class="info-block" style="margin-bottom:0">
      <div class="info-label">📚 書冊資訊 <span style="font-weight:400;color:#aaa;">${bookCountLabel}</span></div>
      <div class="info-content"><ul>${bookHtml}</ul></div>
    </div>
  </div>`;
}

function renderResultList(results) {
  return `<div class="result-list">` +
    results.map(s => `
      <div class="result-item" onclick="showSeries('${s.id}')">
        <div>
          <div class="result-item-name">${s.name}</div>
          <div class="result-item-sub">${s.benefit.substring(0,40)}…</div>
        </div>
        <div class="result-item-age">${s.age}</div>
      </div>`).join("") +
    `</div>`;
}

// ---- 聊天邏輯 ----
function addBubble(role, html) {
  const chat = document.getElementById("chat-area");
  const div = document.createElement("div");
  div.className = `bubble ${role}`;
  const avatar = role === "bot" ? "🤖" : "👤";
  const avatarClass = role;
  if (role === "bot") {
    div.innerHTML = `<div class="avatar bot">${avatar}</div><div>${html}</div>`;
  } else {
    div.innerHTML = `<div class="avatar user">${avatar}</div><div class="msg">${html}</div>`;
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function showSeries(id) {
  const s = SERIES.find(x => x.id === id);
  if (!s) return;
  addBubble("user", `查詢：${s.name}`);
  addBubble("bot", `<div class="msg" style="max-width:100%;padding:0;background:transparent;box-shadow:none;">找到系列資訊如下：</div>` + renderCard(s));
}

function sendQuery(q) {
  document.getElementById("user-input").value = q;
  send();
}

function send() {
  const input = document.getElementById("user-input");
  const q = input.value.trim();
  if (!q) return;
  addBubble("user", q);
  input.value = "";

  const results = searchSeries(q);
  if (results.length === 0) {
    addBubble("bot", `<div class="msg"><span class="no-result">找不到「${q}」相關的書系 😢<br>請試試：閱讀123、樂讀456、達克比、可能小學、幼幼書、知識繪本……</span></div>`);
  } else if (results.length === 1) {
    addBubble("bot", `<div class="msg" style="max-width:100%;padding:0;background:transparent;box-shadow:none;">找到 1 個系列：</div>` + renderCard(results[0]));
  } else {
    addBubble("bot", `<div class="msg">找到 ${results.length} 個相關書系，點選查看詳細資訊：</div>` + renderResultList(results));
  }
}
